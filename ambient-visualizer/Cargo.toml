[package]
name = "ambient-visualizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sarajimenezlara/cosmic-ambient"
description = "Visualizador de audio + canción actual en el fondo de escritorio de COSMIC"

[dependencies]
smithay-client-toolkit = "0.20"
tiny-skia = "0.11"
ab_glyph = "0.2"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

